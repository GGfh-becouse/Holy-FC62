<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071321">
  <title>FIFA 62</title>
  <style>
    :root {
      --ink: #eaf6ff;
      --muted: #91a7bb;
      --blue: #19a7ff;
      --cyan: #6deaff;
      --gold: #ffc85a;
      --navy: #06111e;
      --panel: rgba(9, 30, 49, .72);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--navy); }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(31, 153, 255, .36), transparent 34rem),
        radial-gradient(circle at 2% 96%, rgba(0, 218, 255, .13), transparent 32rem),
        linear-gradient(145deg, #091d30 0%, #06111e 49%, #040a12 100%);
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      content: "";
      pointer-events: none;
    }
    body::before {
      inset: 0;
      opacity: .15;
      background-image: linear-gradient(rgba(132, 217, 255, .26) 1px, transparent 1px), linear-gradient(90deg, rgba(132, 217, 255, .26) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(ellipse at center, black, transparent 76%);
    }
    body::after {
      width: 82vmax;
      height: 82vmax;
      top: 38%;
      left: 50%;
      border: 1px solid rgba(115, 228, 255, .08);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 8vmax rgba(115, 228, 255, .025), 0 0 0 16vmax rgba(115, 228, 255, .018);
    }

    button { font: inherit; }
    .app {
      width: min(100%, 620px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 18px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; letter-spacing: -.04em; }
    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(131, 233, 255, .5);
      border-radius: 10px 3px 10px 3px;
      background: linear-gradient(135deg, rgba(37, 176, 255, .28), rgba(0, 66, 123, .5));
      box-shadow: inset 0 0 15px rgba(108, 236, 255, .12), 0 0 22px rgba(34, 166, 255, .2);
      color: var(--cyan);
      font-size: 1.05rem;
    }
    .brand strong { display: block; font-size: 1.08rem; font-weight: 900; letter-spacing: .035em; }
    .brand small { display: block; margin-top: 1px; color: var(--muted); font-size: .58rem; font-weight: 700; letter-spacing: .2em; }
    .languages { display: flex; padding: 3px; border: 1px solid rgba(143, 204, 232, .12); border-radius: 10px; background: rgba(3, 13, 24, .45); }
    .language {
      padding: 5px 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #6f8aa1;
      cursor: pointer;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .06em;
      transition: .2s ease;
    }
    .language:hover { color: #dff8ff; }
    .language.active { background: rgba(101, 221, 255, .15); color: #dffaff; }

    .opening-stage {
      width: 100%;
      flex: 1;
      display: grid;
      place-items: center;
      padding: 30px 0 20px;
    }
    .pack-screen, .card-screen { width: 100%; display: grid; place-items: center; }
    .card-screen[hidden], .pack-screen[hidden] { display: none; }

    .pack-copy { text-align: center; }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--cyan);
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: .26em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2.25rem, 10vw, 3.75rem); font-weight: 950; letter-spacing: -.07em; line-height: .9; }
    h1 span { color: var(--gold); text-shadow: 0 0 30px rgba(255, 194, 77, .35); }
    .subtitle { margin: 13px 0 0; color: var(--muted); font-size: .83rem; line-height: 1.45; }

    .pack-area { position: relative; width: min(82vw, 320px); aspect-ratio: .72; margin: 27px auto 24px; }
    .aura { position: absolute; inset: 11% -22%; border-radius: 50%; background: radial-gradient(ellipse, rgba(43, 176, 255, .4), rgba(18, 146, 255, .1) 43%, transparent 71%); filter: blur(9px); animation: pulse 2.8s ease-in-out infinite; }
    .pack {
      position: absolute;
      inset: 0;
      width: 100%;
      border: 0;
      border-radius: 18px 4px 20px 5px;
      overflow: hidden;
      cursor: pointer;
      color: white;
      transform: perspective(900px) rotateY(-7deg) rotateZ(2deg);
      transition: transform .28s cubic-bezier(.2,.9,.2,1), filter .28s;
      background:
        linear-gradient(118deg, transparent 0 37%, rgba(255,255,255,.16) 38% 40%, transparent 41% 100%),
        radial-gradient(circle at 79% 16%, #65e5ff 0 2%, transparent 2.4%),
        radial-gradient(circle at 70% 28%, #65e5ff 0 1.2%, transparent 1.7%),
        linear-gradient(140deg, #004b83 0%, #082a53 35%, #071a35 65%, #031327 100%);
      box-shadow: 15px 25px 38px rgba(0, 0, 0, .55), inset 0 0 0 2px rgba(157, 235, 255, .35), inset 0 0 36px rgba(16, 129, 232, .55), 0 0 32px rgba(30, 173, 255, .25);
    }
    .pack::before, .pack::after { position: absolute; content: ""; pointer-events: none; }
    .pack::before { inset: 7px; border: 1px solid rgba(177, 240, 255, .46); border-radius: 13px 2px 15px 3px; }
    .pack::after { width: 140%; height: 30%; top: 40%; left: -22%; opacity: .33; background: linear-gradient(90deg, transparent, #9cf2ff, transparent); transform: rotate(-34deg); filter: blur(8px); }
    .pack:hover:not(:disabled) { transform: perspective(900px) rotateY(-1deg) rotateZ(0) translateY(-8px) scale(1.025); filter: brightness(1.13); }
    .pack:active:not(:disabled) { transform: perspective(900px) rotateY(-2deg) rotateZ(0) translateY(-2px) scale(.985); }
    .pack:focus-visible, .primary:focus-visible, .language:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .pack:disabled { cursor: wait; }
    .pack-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; isolation: isolate; }
    .pack-rarity { position: absolute; top: 18px; left: 0; right: 0; color: rgba(203, 249, 255, .75); font-size: .58rem; font-weight: 800; letter-spacing: .32em; }
    .pack-rating { color: #fff9d7; font-size: clamp(4.2rem, 20vw, 6.2rem); font-weight: 950; font-style: italic; letter-spacing: -.13em; line-height: .8; text-shadow: 0 3px 0 #b77d1c, 0 8px 22px #002647; }
    .pack-title { margin-top: 17px; color: #fff; font-size: 1.65rem; font-weight: 950; font-style: italic; letter-spacing: -.09em; line-height: .85; text-shadow: 0 3px 14px #00162d; }
    .pack-title em { color: #74eeff; font-style: normal; }
    .pack-lines { position: absolute; bottom: 34px; display: flex; gap: 5px; }
    .pack-lines i { display: block; width: 23px; height: 2px; background: #78edff; box-shadow: 0 0 8px #78edff; transform: skewX(-29deg); }
    .pack-lines i:nth-child(2) { width: 34px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    .pack-foot { position: absolute; bottom: 15px; color: rgba(214, 246, 255, .5); font-size: .48rem; font-weight: 800; letter-spacing: .24em; }
    .pack.opening { animation: packOpen .98s ease-in-out forwards; }
    .pack.opening::after { animation: sheen .75s ease-in .12s forwards; }

    .primary {
      min-width: 225px;
      padding: 15px 23px;
      border: 1px solid rgba(151, 235, 255, .5);
      border-radius: 8px 3px 8px 3px;
      color: #001521;
      cursor: pointer;
      background: linear-gradient(115deg, #cefbff, #47d9ff 56%, #1da4e9);
      box-shadow: 0 9px 28px rgba(24, 179, 255, .25), inset 0 1px rgba(255,255,255,.8);
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .18em;
      text-transform: uppercase;
      transition: transform .18s, filter .18s;
    }
    .primary:hover { filter: brightness(1.12); transform: translateY(-2px); }
    .primary:active { transform: translateY(1px) scale(.98); }
    .primary[disabled] { cursor: wait; opacity: .7; }
    .tip { margin: 13px 0 0; color: #627f94; font-size: .67rem; }
    .tip kbd { padding: 2px 5px; border: 1px solid rgba(134,203,234,.25); border-radius: 4px; color: #a7c5d5; font-family: inherit; }

    .card-screen { text-align: center; }
    .result-header { margin-bottom: 16px; }
    .result-header .eyebrow { margin-bottom: 6px; }
    .result-title { margin: 0; font-size: 1.55rem; font-weight: 900; letter-spacing: -.045em; }
    .result-title strong { color: var(--gold); }
    .card-frame {
      position: relative;
      width: min(90vw, 390px);
      min-height: 280px;
      padding: 5px;
      border: 1px solid rgba(126, 229, 255, .45);
      border-radius: 17px 4px 17px 4px;
      background: linear-gradient(140deg, rgba(133, 241, 255, .7), rgba(20, 145, 242, .28) 38%, rgba(255, 199, 82, .58) 100%);
      box-shadow: 0 20px 46px rgba(0, 0, 0, .5), 0 0 46px rgba(28, 176, 255, .2);
      animation: reveal .55s cubic-bezier(.14,.9,.24,1.2) both;
    }
    .card-frame::before { position: absolute; inset: -2px; z-index: -1; border-radius: inherit; content: ""; background: linear-gradient(110deg, transparent 20%, rgba(218,252,255,.72), transparent 49%); filter: blur(10px); }
    .card-image {
      display: block;
      width: 100%;
      max-height: min(62vh, 560px);
      min-height: 270px;
      border-radius: 12px 2px 12px 2px;
      object-fit: contain;
      background: #071522;
    }
    .card-error {
      display: grid;
      width: 100%;
      min-height: 270px;
      padding: 25px;
      place-items: center;
      border-radius: 12px 2px 12px 2px;
      background: linear-gradient(135deg, #102a40, #071522);
      color: #c3dfed;
      font-size: .9rem;
      line-height: 1.5;
    }
    .card-error span { color: #7698ad; font-size: .72rem; }
    .result-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 21px; }
    .secondary { border: 0; padding: 6px 10px; background: transparent; color: #8daabc; cursor: pointer; font-size: .7rem; font-weight: 700; letter-spacing: .09em; text-decoration: underline; text-underline-offset: 4px; }
    .secondary:hover { color: white; }

    .footer { width: 100%; margin-top: auto; padding-top: 10px; color: #547287; font-size: .59rem; font-weight: 650; letter-spacing: .1em; text-align: center; text-transform: uppercase; }
    #fx { position: fixed; inset: 0; z-index: 10; width: 100%; height: 100%; pointer-events: none; }

    @keyframes pulse { 50% { opacity: .58; transform: scale(1.08); } }
    @keyframes packOpen {
      0% { transform: perspective(900px) rotateY(-7deg) rotateZ(2deg) scale(1); }
      17% { transform: perspective(900px) rotateY(9deg) rotateZ(-4deg) scale(.97); }
      38% { transform: perspective(900px) rotateY(-14deg) rotateZ(5deg) scale(1.03); filter: brightness(1.5); }
      61% { transform: perspective(900px) rotateY(6deg) rotateZ(-2deg) scale(1.02); filter: brightness(2); }
      100% { transform: perspective(900px) rotateY(0) rotateZ(0) scale(1.13); filter: brightness(2.8); opacity: .08; }
    }
    @keyframes sheen { to { transform: translate(80%, -100%) rotate(-34deg); opacity: .9; } }
    @keyframes reveal { from { opacity: 0; transform: translateY(28px) scale(.82); filter: brightness(2.3); } to { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1); } }
    @media (max-height: 720px) { .opening-stage { padding-top: 15px; } .pack-area { width: min(63vw, 235px); margin: 18px auto; } .subtitle { margin-top: 9px; } }
    @media (max-width: 380px) { .app { padding-inline: 13px; } .pack-area { width: min(78vw, 270px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-label="FIFA 62">
        <div class="brand-mark">⚽</div>
        <div><strong>FIFA 62</strong><small>Ultimate Pack</small></div>
      </div>
      <nav class="languages" aria-label="Язык">
        <button class="language active" type="button" data-lang="ru">RU</button>
        <button class="language" type="button" data-lang="en">EN</button>
        <button class="language" type="button" data-lang="kz">KZ</button>
      </nav>
    </header>

    <section class="opening-stage" aria-live="polite">
      <div id="packScreen" class="pack-screen">
        <div class="pack-copy">
          <p class="eyebrow" id="eyebrow">ЛЕГЕНДАРНЫЙ НАБОР</p>
          <h1 id="heading">ОТКРОЙ <span>ПАК</span></h1>
          <p class="subtitle" id="subtitle">Каждое открытие — новая футбольная карта.</p>
        </div>

        <div class="pack-area">
          <div class="aura"></div>
          <button id="pack" class="pack" type="button" aria-label="Открыть пак">
            <span class="pack-inner">
              <span class="pack-rarity">LEGENDARY</span>
              <span class="pack-rating">62</span>
              <span class="pack-title">FIFA <em>62</em></span>
              <span class="pack-lines"><i></i><i></i><i></i></span>
              <span class="pack-foot">ULTIMATE PACK</span>
            </span>
          </button>
        </div>

        <button id="openButton" class="primary" type="button">ОТКРЫТЬ ПАК</button>
        <p class="tip" id="tip">Нажми на пак или кнопку</p>
      </div>

      <div id="cardScreen" class="card-screen" hidden>
        <div class="result-header">
          <p class="eyebrow" id="resultEyebrow">ТВОЙ НОВЫЙ ИГРОК</p>
          <p class="result-title" id="resultTitle">КАРТА <strong>ВЫПАЛА!</strong></p>
        </div>
        <div class="card-frame" id="cardFrame"></div>
        <div class="result-actions">
          <button id="againButton" class="primary" type="button">ОТКРЫТЬ ЕЩЁ</button>
          <button id="backButton" class="secondary" type="button">Вернуться к набору</button>
        </div>
      </div>
    </section>

    <footer class="footer" id="footer">FIFA 62 · Pack opening experience</footer>
  </main>
  <canvas id="fx" aria-hidden="true"></canvas>

  <script>
    // Добавляй сюда точные имена файлов из папки images.
    // Структура: index.html и папка images должны находиться рядом.
    const cards = [
  "1.jpeg", "2.jpeg", "3.jpeg", "4.jpeg", "5.jpeg", "6.jpg",
  "7.jpeg", "8.jpeg", "9.jpeg", "10.jpeg", "11.jpeg", "12.jpeg"
];
    const cardDirectory = "images";

    const text = {
      ru: {
        eyebrow: "ЛЕГЕНДАРНЫЙ НАБОР", heading: "ОТКРОЙ <span>ПАК</span>", subtitle: "Каждое открытие — новая футбольная карта.",
        open: "ОТКРЫТЬ ПАК", opening: "ОТКРЫВАЕМ…", tip: "Нажми на пак или кнопку", resultEyebrow: "ТВОЙ НОВЫЙ ИГРОК",
        result: "КАРТА <strong>ВЫПАЛА!</strong>", again: "ОТКРЫТЬ ЕЩЁ", back: "Вернуться к набору", footer: "FIFA 62 · Открытие наборов",
        missing: "Карта не найдена", check: "Проверь путь:"
      },
      en: {
        eyebrow: "LEGENDARY PACK", heading: "OPEN THE <span>PACK</span>", subtitle: "Every opening reveals a new football card.",
        open: "OPEN PACK", opening: "OPENING…", tip: "Tap the pack or the button", resultEyebrow: "YOUR NEW PLAYER",
        result: "CARD <strong>REVEALED!</strong>", again: "OPEN ANOTHER", back: "Back to the pack", footer: "FIFA 62 · Pack opening experience",
        missing: "Card not found", check: "Check the path:"
      },
      kz: {
        eyebrow: "АҢЫЗДЫҚ ЖИНАҚ", heading: "ПАКЕТТІ <span>АШ</span>", subtitle: "Әр ашылым — жаңа футбол картасы.",
        open: "ПАКЕТТІ АШУ", opening: "АШЫЛУДА…", tip: "Пакетке не батырмаға бас", resultEyebrow: "СЕНІҢ ЖАҢА ОЙЫНШЫҢ",
        result: "КАРТА <strong>ТҮСТІ!</strong>", again: "ҚАЙТА АШУ", back: "Пакетке оралу", footer: "FIFA 62 · Пакеттерді ашу",
        missing: "Карта табылмады", check: "Жолды тексер:"
      }
    };

    const packScreen = document.getElementById("packScreen");
    const cardScreen = document.getElementById("cardScreen");
    const pack = document.getElementById("pack");
    const openButton = document.getElementById("openButton");
    const againButton = document.getElementById("againButton");
    const backButton = document.getElementById("backButton");
    const cardFrame = document.getElementById("cardFrame");
    const fx = document.getElementById("fx");
    const context = fx.getContext("2d");
    let language = "ru";
    let opening = false;
    let lastCard = null;
    let particles = [];
    let animationId = 0;

    function currentText() { return text[language]; }
    function cardPath(fileName) { return `${cardDirectory}/${encodeURIComponent(fileName)}`; }
    function pickCard() {
      if (!cards.length) return null;
      if (cards.length === 1) return cards[0];
      const options = cards.filter(card => card !== lastCard);
      return options[Math.floor(Math.random() * options.length)];
    }

    function setLanguage(nextLanguage) {
      language = nextLanguage;
      const copy = currentText();
      document.querySelectorAll(".language").forEach(button => button.classList.toggle("active", button.dataset.lang === language));
      document.getElementById("eyebrow").textContent = copy.eyebrow;
      document.getElementById("heading").innerHTML = copy.heading;
      document.getElementById("subtitle").textContent = copy.subtitle;
      document.getElementById("tip").textContent = copy.tip;
      document.getElementById("resultEyebrow").textContent = copy.resultEyebrow;
      document.getElementById("resultTitle").innerHTML = copy.result;
      document.getElementById("againButton").textContent = copy.again;
      document.getElementById("backButton").textContent = copy.back;
      document.getElementById("footer").textContent = copy.footer;
      if (!opening) openButton.textContent = copy.open;
      try { localStorage.setItem("fifa62-language", language); } catch (_) {}
    }

    function resizeCanvas() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      fx.width = Math.floor(window.innerWidth * pixelRatio);
      fx.height = Math.floor(window.innerHeight * pixelRatio);
      fx.style.width = `${window.innerWidth}px`;
      fx.style.height = `${window.innerHeight}px`;
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function launchParticles() {
      const colors = ["#78efff", "#ffffff", "#ffc85a", "#2c9dff", "#a8f4ff"];
      const centerX = window.innerWidth / 2;
      const centerY = Math.min(window.innerHeight * .47, 370);
      particles = Array.from({ length: 72 }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        return { x: centerX, y: centerY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, life: 1, decay: .012 + Math.random() * .017, size: 1 + Math.random() * 3.5, color: colors[Math.floor(Math.random() * colors.length)] };
      });
      cancelAnimationFrame(animationId);
      drawParticles();
    }

    function drawParticles() {
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
      let alive = false;
      for (const particle of particles) {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += .06;
        particle.vx *= .985;
        particle.life -= particle.decay;
        if (particle.life <= 0) continue;
        alive = true;
        context.globalAlpha = particle.life;
        context.fillStyle = particle.color;
        context.shadowColor = particle.color;
        context.shadowBlur = 12;
        context.beginPath();
        context.arc(particle.x, particle.y, particle.size * particle.life, 0, Math.PI * 2);
        context.fill();
      }
      context.globalAlpha = 1;
      context.shadowBlur = 0;
      if (alive) animationId = requestAnimationFrame(drawParticles);
      else context.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    function showCard(fileName) {
      const copy = currentText();
      packScreen.hidden = true;
      cardScreen.hidden = false;
      cardFrame.innerHTML = "";
      const image = new Image();
      image.className = "card-image";
      image.alt = "FIFA 62 card";
      image.src = cardPath(fileName);
      image.addEventListener("load", launchParticles, { once: true });
      image.addEventListener("error", () => {
        cardFrame.innerHTML = `<div class="card-error"><div>${copy.missing}<br><span>${copy.check} ${cardPath(fileName)}</span></div></div>`;
        launchParticles();
      }, { once: true });
      cardFrame.append(image);
      lastCard = fileName;
    }

    function openPack() {
      if (opening) return;
      const selectedCard = pickCard();
      if (!selectedCard) return;
      opening = true;
      pack.disabled = true;
      openButton.disabled = true;
      openButton.textContent = currentText().opening;
      pack.classList.remove("opening");
      void pack.offsetWidth;
      pack.classList.add("opening");
      window.setTimeout(() => {
        pack.classList.remove("opening");
        pack.disabled = false;
        openButton.disabled = false;
        opening = false;
        openButton.textContent = currentText().open;
        showCard(selectedCard);
      }, 980);
    }

    function returnToPack() {
      cardScreen.hidden = true;
      packScreen.hidden = false;
      particles = [];
      cancelAnimationFrame(animationId);
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
      pack.focus();
    }

    document.querySelectorAll(".language").forEach(button => button.addEventListener("click", () => setLanguage(button.dataset.lang)));
    pack.addEventListener("click", openPack);
    openButton.addEventListener("click", openPack);
    againButton.addEventListener("click", () => { returnToPack(); window.setTimeout(openPack, 100); });
    backButton.addEventListener("click", returnToPack);
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", event => { if ((event.key === "Enter" || event.key === " ") && !opening && !cardScreen.hidden) { event.preventDefault(); returnToPack(); } });

    resizeCanvas();
    try { setLanguage(localStorage.getItem("fifa62-language") || "ru"); } catch (_) { setLanguage("ru"); }
  </script>
</body>
</html>
